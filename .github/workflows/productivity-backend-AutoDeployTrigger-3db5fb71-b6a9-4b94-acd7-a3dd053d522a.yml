name: Trigger auto deployment for productivity-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/productivity-backend-AutoDeployTrigger-3db5fb71-b6a9-4b94-acd7-a3dd053d522a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PRODUCTIVITYBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PRODUCTIVITYBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PRODUCTIVITYBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: productivitytrackeracr-hqdafbapdjeehdb4.azurecr.io
          registryUsername: ${{ secrets.PRODUCTIVITYBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PRODUCTIVITYBACKEND_REGISTRY_PASSWORD }}
          containerAppName: productivity-backend
          resourceGroup: productivity-tracker_group
          imageToBuild: productivitytrackeracr-hqdafbapdjeehdb4.azurecr.io/productivity-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


